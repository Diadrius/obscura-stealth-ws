name: Release (stealth, linux x86_64)

# Replaces upstream's multi-platform release workflow: this fork only ships the
# no-render stealth build for Linux x86_64. Trigger: push a tag like v0.2.4-ws.1.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Ubuntu 22.04 so the binary runs on hosts with glibc 2.35+.
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Install stealth build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang libclang-dev llvm-dev

      - name: Build no-render stealth binary
        run: cargo build --profile release-dist -p obscura-cli --bins --no-default-features --features stealth

      - name: Smoke test (V8 snapshot, offline)
        run: target/release-dist/obscura fetch "data:text/html,<title>ok</title>" --eval "1+1"

      - name: Package
        run: |
          tar czf obscura-x86_64-linux-stealth.tar.gz -C target/release-dist obscura obscura-worker
          sha256sum obscura-x86_64-linux-stealth.tar.gz | tee obscura-x86_64-linux-stealth.tar.gz.sha256

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release
          path: obscura-x86_64-linux-stealth.tar.gz*
          if-no-files-found: error
          retention-days: 7

      # One process per test: the engine holds a single V8 isolate per process.
      - name: WebSocket tests
        run: |
          for t in page_websocket_echoes page_websocket_respects_private_network_gate \
                   websocket_handshake_omits_deflate_by_default websocket_handshake_offers_deflate_when_enabled; do
            cargo test --profile release-dist -p obscura --features stealth --test websocket -- --exact "$t"
          done

      - name: Check render + stealth still builds
        run: cargo check --profile release-dist -p obscura-cli --bins --features render,stealth

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release
          path: dist
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*
